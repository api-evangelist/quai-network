aid: quai-network
name: Quai Network
description: >-
  Quai Network is a sharded, EVM-compatible proof-of-work Layer-1 blockchain
  built by Dominant Strategies, featuring two native assets: QUAI, a
  smart-contract account-model asset, and Qi, a UTXO-model privacy asset. Quai
  uses Proof-of-Entropy-Minima (PoEM) consensus with merged mining across a
  hierarchical structure of Prime, Region, and Zone chains braided into one
  network. For developers, Quai exposes an Ethereum-compatible JSON-RPC API in
  the `quai_` namespace (plus a GraphQL endpoint and Postman collection), the
  Quais SDK (a fork of Ethers v6) for JavaScript/TypeScript dApps and wallets,
  and the go-quai node/CLI for running nodes and miners. The canonical active
  zone is Cyprus-1 (chainId 9 on mainnet, 15000 on the Orchard testnet).

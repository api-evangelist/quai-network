apis:
- name: Quai Network JSON-RPC API
  description: >-
    Ethereum-compatible JSON-RPC API for Quai Network in the `quai_` namespace.
    Query balances, code, storage and proofs; read blocks, headers and uncles;
    look up and send transactions (Protobuf-encoded); inspect the txpool; read
    gas and fee history; and perform Quai <-> Qi conversions. Served over HTTPS
    and WSS per zone (canonical zone: Cyprus-1).
